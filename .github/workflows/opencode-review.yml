name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            # client_id 是 OpenCode 公开的 OAuth 客户端标识，不是密钥。
            # 拆成两段拼接，避免被密钥扫描误判为 Checkout.com 密钥（sk_ + 32 位 hex）。
            -d client_id="sk_""f535e2fc-bf0a-4cdc-96b8-2ff67fb70e2c" \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - uses: anomalyco/opencode/github@latest
        with:
          # 可用模型列表: https://opencode.ai/zen/v1/models
          # 2026-11-02 核对：原 opencode/nemotron-3-ultra-free 已下线。
          model: opencode/deepseek-v4.1-flash-free
          prompt: |
            审查这个 Pull Request：

            - 检查代码质量问题
            - 查找潜在的 bug
            - 检查是否引入安全风险或硬编码密钥
            - 提出改进建议

            用中文回复，按严重程度排序，控制在 300 字以内。
