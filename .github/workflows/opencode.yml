name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # 排除 bot 自身发布的评论再次触发（否则 opencode-agent[bot] 的回复会造成
    # 循环触发，并在 Issue 里留下 "does not have write permissions" 噪声评论）
    if: |
      !endsWith(github.event.comment.user.login, '[bot]') &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      # OIDC 换 token 必需
      id-token: write
      # 显式声明 permissions 会把未列出的权限全部清零，
      # 缺这几个时机器人无法回评论/推分支，只会留下 "does not have write permissions"
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # 用 GitHub Actions 的 OIDC 身份换取 OpenCode Console 的短期 token。
      # 优点：不需要在仓库里存 OPENCODE_API_KEY，token 每次运行自动签发、到期即失效。
      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_f535e2fc-bf0a-4cdc-96b8-2ff67fb70e2c \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          # 格式 provider/model。可用列表: https://opencode.ai/zen/v1/models
          # 2026-11-02 核对：原 opencode/nemotron-3-ultra-free 已从目录下线。
          model: opencode/deepseek-v4.1-flash-free
          # 备选：opencode/glm-5.3-flash-free、opencode/nemotron-3.5-lightning-free
          # share: true    # 公开仓库默认 true，不希望会话被公开分享则设为 false
          # agent: build   # 可选，默认 build
          # github_token: xxxx  # 可选，默认使用 opencode-agent App 的安装令牌
